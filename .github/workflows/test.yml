name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      # Extension tests launch headed Chromium; Linux runners need a virtual display.
      - name: directions (stable subset)
        run: xvfb-run --auto-servernum npx playwright test tests/directions-native.spec.js --grep "user flow|/dir/ URL"
      - name: popup On/Off
        run: xvfb-run --auto-servernum npx playwright test tests/popup.spec.js
