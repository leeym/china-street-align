  <rect width="640" height="360" fill="#1a1a2e"/>
  <rect x="40" y="40" width="560" height="280" rx="8" fill="#2d4a3e"/>
  <path d="M120 200 L520 180 L500 240 L140 260 Z" fill="#3a5a40" opacity="0.9"/>
  <rect x="280" y="120" width="80" height="100" fill="#8b7355" stroke="#c4a574" stroke-width="2"/>
  <rect x="300" y="140" width="40" height="60" fill="#5c4033"/>
  <text x="320" y="115" text-anchor="middle" fill="#e8e8e8" font-family="system-ui,sans-serif" font-size="14">Hall (satellite, WGS-84)</text>
