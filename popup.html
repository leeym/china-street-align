<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>China Street Align</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>China Street Align</h1>
    <p class="sub">
      Inside China, WGS-84 satellite imagery and GCJ-02 map layers must line up.
      Hybrid mode aligns them when possible and falls back to Google’s map when not.
    </p>
    <p class="current">Active: <strong id="current">…</strong> · <span id="version"></span></p>
    <p id="error" class="error" hidden></p>
    <form id="modes">
      <label class="mode">
        <input type="radio" name="alignMode" value="hybrid" />
        <span class="title">Hybrid</span>
        <span class="desc">
          Crisp aligned satellite when you are only toggling photo vs map. Search,
          directions, terrain, traffic, Street View coverage and similar layers
          force the vector Map basemap so Google paints them natively. Place pages
          may get one aligned teardrop when the pin datum does not match the basemap.
        </span>
      </label>
      <label class="mode">
        <input type="radio" name="alignMode" value="off" />
        <span class="title">Off</span>
        <span class="desc">Native Google Maps, no alignment.</span>
      </label>
    </form>
    <p class="hint">Maps tab also has an Align bar (top-right).</p>
    <script src="popup.js"></script>
  </body>
</html>
