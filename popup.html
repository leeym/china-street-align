<!doctype html>
<html>
<head><meta charset="utf-8"><style>
body{font:14px system-ui,sans-serif;width:280px;margin:14px}
h1{font-size:15px;margin:0 0 4px}
.ver{font-size:12px;color:#666;margin-bottom:12px}
button{width:100%;margin:5px 0;padding:8px;text-align:left}
button.active{outline:2px solid #1a73e8}
.small{font-size:12px;color:#555;line-height:1.4;margin-top:10px}
</style></head>
<body>
<h1>China Street Align</h1>
<div class="ver" id="version"></div>
<button id="on">On — align streets to satellite (default)</button>
<button id="off">Off — original Google Maps</button>
<div class="small">In China, satellite is WGS-84 and Google’s street tiles are GCJ-02. When On, street tiles are shifted onto the satellite. Outside China the overlay stays off. After updating the extension, close the Maps tab and open it again.</div>
<script src="popup.js"></script>
</body>
</html>
